# GHOULBOX: the host tests on every push and pull request (tests/run_tests.sh, HOST_ONLY=1).
# No JieLi toolchain or SDK here: tools/build.py --gen-only makes build/gen (the generated headers) and the tests
# that need the firmware image itself (the update entry and loader, the target cost) are skipped; build them
# locally with ./build.sh. Python and its packages are pinned: tools/gen_samples.py's results (and so the golden
# renders) follow the float summation of the Python version.
name: host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python packages
        run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1 numpy==2.5.3

      - name: Generated headers (no toolchain)
        run: python3 tools/build.py --gen-only

      - name: Host tests
        run: HOST_ONLY=1 tests/run_tests.sh
